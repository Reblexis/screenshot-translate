[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenshot-translate"
version = "0.1.0"
description = "Translate text inside screenshots into any language using OpenAI gpt-image-2."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Viktor Cihal" }]
keywords = ["openai", "gpt-image-2", "screenshot", "translation", "localization", "i18n", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "openai>=1.55.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Reblexis/screenshot-translate"
Issues = "https://github.com/Reblexis/screenshot-translate/issues"

[project.scripts]
screenshot-translate = "screenshot_translate.cli:main"
sst = "screenshot_translate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["screenshot_translate"]
